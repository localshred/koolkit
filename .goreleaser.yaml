# koolkit/.goreleaser.yaml
version: 2
project_name: koolkit
builds:
  - id: kk
    main: .
    binary: kk
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - id: kk
    name_template: "koolkit_{{ title .Os }}_{{ .Arch }}"
    formats: [tar.gz]
checksum:
  name_template: checksums.txt
brews:
  - name: koolkit
    repository:
      owner: localshred
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/localshred/koolkit
    description: Self-contained dev-utility plugin suite (kk)
    install: |
      bin.install "kk"
release:
  github:
    owner: localshred
    name: koolkit
